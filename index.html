<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaDesk — Pharmacy Management</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#234A45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PharmaDesk">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F3EA; --surface:#FFFFFF; --surface-alt:#EEE8DA; --ink:#1E2B27; --ink-soft:#62716B;
    --teal:#234A45; --teal-light:#3D7A73; --teal-pale:#E4EDE9;
    --amber:#B4772A; --amber-pale:#FBEEDC;
    --red:#A02B3E; --red-pale:#FBE4E7; --red-dark:#6E1626;
    --green:#4C7A55; --green-pale:#E8F0E5;
    --line:#DED6C2;
    --shadow: 0 1px 2px rgba(30,43,39,0.06), 0 8px 24px -12px rgba(30,43,39,0.18);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; padding:16px 12px 60px; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:980px; margin:0 auto;}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}

  header.top{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .rx-icon{width:36px;height:36px;border-radius:9px;background:var(--teal);display:flex;align-items:center;justify-content:center;color:#F6F3EA;font-family:'Fraunces',serif;font-weight:700;font-size:18px;flex-shrink:0;box-shadow:var(--shadow);}
  header.top h1{font-size:22px; color:var(--teal); letter-spacing:-.01em;}
  header.top .sub{font-size:12px; color:var(--ink-soft);}

  nav.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px; -webkit-overflow-scrolling:touch;}
  nav.tabs::-webkit-scrollbar{display:none;}
  .tabbtn{flex-shrink:0; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); padding:8px 14px; border-radius:100px; font-size:13px; font-weight:600;}
  .tabbtn.active{background:var(--teal); color:#F6F3EA; border-color:var(--teal);}

  .stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:18px;}
  @media(min-width:640px){.stats{grid-template-columns:repeat(3,1fr);}}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:13px 14px; box-shadow:var(--shadow);}
  .stat .label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600;}
  .stat .value{font-family:'Fraunces',serif; font-size:21px; font-weight:600; margin-top:3px;}
  .stat.warn .value{color:var(--amber);} .stat.danger .value{color:var(--red);}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:15px; box-shadow:var(--shadow); margin-bottom:12px;}
  .card h3{font-size:15px; margin-bottom:8px; color:var(--teal);}
  .row-between{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px;}

  .btn{border:none; border-radius:9px; padding:9px 14px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px;}
  .btn-primary{background:var(--teal); color:#F6F3EA; box-shadow:var(--shadow);}
  .btn-primary:hover{background:var(--teal-light);}
  .btn-ghost{background:var(--surface); color:var(--teal); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-small{padding:6px 10px; font-size:12px; border-radius:7px;}
  .btn-danger-text{background:transparent; color:var(--red); border:none; font-size:12px; font-weight:600;}
  .btn-text{background:transparent; color:var(--ink-soft); font-size:12.5px; font-weight:600;}

  input[type=text],input[type=number],input[type=date],select{
    width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); font-size:13.5px; color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--teal-light); outline-offset:1px; background:var(--surface);}
  label{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:4px;}
  .field{margin-bottom:11px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding:6px 8px; border-bottom:1px solid var(--line);}
  td{padding:7px 8px; border-bottom:1px solid var(--line); font-family:'IBM Plex Mono',monospace; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .tbl-wrap{overflow-x:auto;}
  td input, td select{font-family:'IBM Plex Mono',monospace; font-size:12px; padding:5px 6px;}

  .badge{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:100px; white-space:nowrap; font-family:'IBM Plex Sans',sans-serif;}
  .badge.ok{background:var(--green-pale); color:var(--green);}
  .badge.amber{background:var(--amber-pale); color:var(--amber);}
  .badge.red{background:var(--red-pale); color:var(--red);}
  .badge.dark{background:var(--red-dark); color:#fff;}
  .badge.gray{background:var(--surface-alt); color:var(--ink-soft);}

  .list-row{display:flex; align-items:center; justify-content:space-between; padding:10px 4px; border-bottom:1px solid var(--line); gap:10px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .name{font-weight:600; font-size:13.5px;}
  .list-row .meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .list-row .right{text-align:right; flex-shrink:0;}
  .list-row .amt{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13.5px;}
  .icon-btn{background:transparent;border:none;width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);}
  .icon-btn:hover{background:var(--surface-alt); color:var(--ink);}

  .expand-body{padding:10px 4px 4px;}
  .empty{text-align:center; padding:40px 16px; color:var(--ink-soft); font-size:13px;}
  .search-box{position:relative; flex:1 1 180px;}
  .search-box input{padding-left:30px;}
  .search-box svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.5;}

  .overlay{position:fixed; inset:0; background:rgba(30,43,39,.45); display:none; align-items:flex-end; justify-content:center; z-index:50;}
  @media(min-width:640px){.overlay{align-items:center;}}
  .overlay.show{display:flex;}
  .modal{background:var(--surface); width:100%; max-width:440px; border-radius:16px 16px 0 0; padding:18px 18px 22px; max-height:88vh; overflow-y:auto;}
  @media(min-width:640px){.modal{border-radius:16px;}}
  .modal h2{font-size:18px; margin-bottom:14px; color:var(--teal);}
  .modal-actions{display:flex; gap:8px; margin-top:16px;}
  .modal-actions .btn{flex:1; justify-content:center;}
  .err{color:var(--red); font-size:12px; margin-top:8px; display:none;}
  .err.show{display:block;}

  .toast{position:fixed; bottom:16px; left:50%; transform:translateX(-50%) translateY(80px); opacity:0; background:var(--teal); color:#F6F3EA; padding:10px 18px; border-radius:100px; font-size:13px; font-weight:600; box-shadow:var(--shadow); transition:all .25s ease; z-index:60; white-space:nowrap;}
  .toast.show{transform:translateX(-50%) translateY(0); opacity:1;}
  .loading{text-align:center; padding:60px; color:var(--ink-soft); font-size:13px;}
  .footer-totals{display:flex; flex-direction:column; gap:6px; align-items:flex-end; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);}
  .footer-totals .line{display:flex; justify-content:space-between; width:220px; max-width:100%; font-size:13px;}
  .footer-totals .grand{font-family:'Fraunces',serif; font-size:19px; font-weight:700; color:var(--teal); border-top:1px solid var(--line); padding-top:6px; margin-top:2px;}
  .subtab{display:flex; gap:6px; margin-bottom:12px;}
  .subtab button{border:1px solid var(--line); background:var(--surface); padding:6px 12px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .subtab button.active{background:var(--teal-pale); color:var(--teal); border-color:var(--teal-pale);}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="rx-icon">℞</div>
    <div>
      <h1>PharmaDesk</h1>
      <div class="sub">Billing · GRN · Inventory · Expiry — pharmacy management</div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tabbtn active" data-tab="dashboard">Dashboard</button>
    <button class="tabbtn" data-tab="inventory">Inventory</button>
    <button class="tabbtn" data-tab="purchases">Purchases / GRN</button>
    <button class="tabbtn" data-tab="billing">Billing</button>
    <button class="tabbtn" data-tab="parties">Parties</button>
    <button class="tabbtn" data-tab="reports">Reports</button>
  </nav>

  <div id="loading" class="loading">Loading PharmaDesk…</div>

  <div id="app" style="display:none;">
    <div id="tab-dashboard" class="tabpane"></div>
    <div id="tab-inventory" class="tabpane" style="display:none;"></div>
    <div id="tab-purchases" class="tabpane" style="display:none;"></div>
    <div id="tab-billing" class="tabpane" style="display:none;"></div>
    <div id="tab-parties" class="tabpane" style="display:none;"></div>
    <div id="tab-reports" class="tabpane" style="display:none;"></div>
  </div>
</div>

<!-- Item Modal -->
<div class="overlay" id="itemOverlay">
  <div class="modal">
    <h2 id="itemModalTitle">Add item</h2>
    <div class="field"><label>Item name</label><input type="text" id="im_name" placeholder="e.g. Paclitaxel 100mg Injection"></div>
    <div class="grid2">
      <div class="field"><label>Category</label>
        <select id="im_category"><option>Chemotherapy</option><option>Antibiotics</option><option>Analgesics</option><option>Antiemetics</option><option>IV Fluids</option><option>Supportive Care</option><option>Consumables</option><option>Other</option></select>
      </div>
      <div class="field"><label>Unit</label>
        <select id="im_unit"><option>Vials</option><option>Tablets</option><option>Capsules</option><option>Ampoules</option><option>Bottles</option><option>Boxes</option><option>Strips</option><option>ml</option><option>Units</option></select>
      </div>
    </div>
    <div class="grid2">
      <div class="field"><label>HSN code (optional)</label><input type="text" id="im_hsn" placeholder="e.g. 3004"></div>
      <div class="field"><label>GST %</label>
        <select id="im_gst"><option value="0">0%</option><option value="5">5%</option><option value="12">12%</option><option value="18">18%</option><option value="28">28%</option></select>
      </div>
    </div>
    <div class="field"><label>Reorder level</label><input type="number" id="im_reorder" min="0" placeholder="10"></div>
    <div class="err" id="im_err">Please enter an item name.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('itemOverlay')">Cancel</button>
      <button class="btn btn-primary" onclick="saveItemMaster()">Save item</button>
    </div>
  </div>
</div>

<!-- Party Modal -->
<div class="overlay" id="partyOverlay">
  <div class="modal">
    <h2 id="partyModalTitle">Add supplier</h2>
    <div class="field"><label>Name</label><input type="text" id="pm_name"></div>
    <div class="field"><label>Phone</label><input type="text" id="pm_phone"></div>
    <div class="field" id="pm_gstin_field"><label>GSTIN (optional)</label><input type="text" id="pm_gstin"></div>
    <div class="field"><label>Address (optional)</label><input type="text" id="pm_address"></div>
    <div class="err" id="pm_err">Please enter a name.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('partyOverlay')">Cancel</button>
      <button class="btn btn-primary" onclick="saveParty()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- State ---------------- */
let items = [];       // {id,name,category,unit,hsn,gst,reorder,batches:[{id,batchNo,expiry,qty,purchasePrice,salePrice}]}
let suppliers = [];   // {id,name,phone,gstin,address}
let customers = [];   // {id,name,phone,address}
let purchases = [];   // {id,no,date,supplierId,supplierName,lines:[...],total}
let sales = [];        // {id,no,date,customerId,customerName,lines:[...],subtotal,gstTotal,discount,total,payMode}
let meta = {grnCounter:0, invCounter:0};

let activeTab = 'dashboard';
let invExpanded = {};        // itemId -> bool
let grnMode = 'list';        // 'list' | 'form'
let saleMode = 'list';
let grnLines = [];
let saleLines = [];
let grnSupplierId = null;
let saleCustomerId = null;
let partyModalType = 'supplier';
let partySubTab = 'suppliers';
let reportSubTab = 'stock';

const $ = (id)=>document.getElementById(id);
const CATS = ['Chemotherapy','Antibiotics','Analgesics','Antiemetics','IV Fluids','Supportive Care','Consumables','Other'];
const fmtINR = (n)=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const todayISO = ()=> new Date().toISOString().slice(0,10);
const fmtDate = (iso)=> iso ? new Date(iso).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const pad = (n,l)=> String(n).padStart(l,'0');
const uid = ()=> 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const escapeHTML = (s)=> String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function daysLeft(expiry){ return Math.round((new Date(expiry) - new Date(todayISO()))/86400000); }
function tier(d){ if(d<0) return 'expired'; if(d<=30) return 'soon'; if(d<=90) return 'watch'; return 'ok'; }
function tierClass(t){ return t==='expired'?'dark':t==='soon'?'red':t==='watch'?'amber':'ok'; }
function tierLabel(t,d){ return t==='expired' ? `Expired ${Math.abs(d)}d ago` : `${d}d left`; }

function itemTotalQty(item){ return item.batches.reduce((s,b)=>s+b.qty,0); }
function itemStockValue(item){ return item.batches.reduce((s,b)=>s+b.qty*b.purchasePrice,0); }
function itemNearestExpiry(item){
  if(!item.batches.length) return null;
  return item.batches.reduce((min,b)=> !min || new Date(b.expiry)<new Date(min.expiry) ? b : min, null);
}

function showToast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function closeModal(id){ $(id).classList.remove('show'); }

/* ---------------- Persistence ---------------- */
async function loadAll(){
  function getKey(key, fallback){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  }
  items = getKey('pharma_items', []);
  const p = getKey('pharma_parties', {suppliers:[],customers:[]});
  suppliers = p.suppliers||[]; customers = p.customers||[];
  purchases = getKey('pharma_purchases', []);
  sales = getKey('pharma_sales', []);
  meta = getKey('pharma_meta', {grnCounter:0,invCounter:0});
  $('loading').style.display='none';
  $('app').style.display='block';
  renderDashboard();
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}
async function saveItems(){ try{ localStorage.setItem('pharma_items', JSON.stringify(items)); }catch(e){ showToast('Save failed — device storage may be full'); } }
async function saveParties(){ try{ localStorage.setItem('pharma_parties', JSON.stringify({suppliers,customers})); }catch(e){ showToast('Save failed — device storage may be full'); } }
async function savePurchases(){ try{ localStorage.setItem('pharma_purchases', JSON.stringify(purchases)); }catch(e){ showToast('Save failed — device storage may be full'); } }
async function saveSales(){ try{ localStorage.setItem('pharma_sales', JSON.stringify(sales)); }catch(e){ showToast('Save failed — device storage may be full'); } }
async function saveMeta(){ try{ localStorage.setItem('pharma_meta', JSON.stringify(meta)); }catch(e){ showToast('Save failed — device storage may be full'); } }

/* ---------------- Tabs ---------------- */
document.querySelectorAll('.tabbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active', b===btn));
    document.querySelectorAll('.tabpane').forEach(p=>p.style.display='none');
    $('tab-'+activeTab).style.display='block';
    if(activeTab==='dashboard') renderDashboard();
    if(activeTab==='inventory') renderInventory();
    if(activeTab==='purchases'){ grnMode='list'; renderPurchases(); }
    if(activeTab==='billing'){ saleMode='list'; renderBilling(); }
    if(activeTab==='parties') renderParties();
    if(activeTab==='reports') renderReports();
  });
});

/* ---------------- Dashboard ---------------- */
function renderDashboard(){
  const totalItems = items.length;
  const stockValue = items.reduce((s,i)=>s+itemStockValue(i),0);
  const todaySales = sales.filter(s=>s.date===todayISO()).reduce((s,x)=>s+x.total,0);
  let expiringSoon=0, expired=0, lowStock=0;
  items.forEach(i=>{
    i.batches.forEach(b=>{ const d=daysLeft(b.expiry); if(d<0) expired++; else if(d<=30) expiringSoon++; });
    if(itemTotalQty(i) <= i.reorder) lowStock++;
  });
  const recentSales = [...sales].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
  const recentGRNs = [...purchases].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);

  $('tab-dashboard').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="label">Total items</div><div class="value">${totalItems}</div></div>
      <div class="stat"><div class="label">Stock value</div><div class="value" style="font-size:17px;">${fmtINR(stockValue)}</div></div>
      <div class="stat"><div class="label">Today's sales</div><div class="value" style="font-size:17px;">${fmtINR(todaySales)}</div></div>
      <div class="stat warn"><div class="label">Expiring ≤30d</div><div class="value">${expiringSoon}</div></div>
      <div class="stat danger"><div class="label">Expired batches</div><div class="value">${expired}</div></div>
      <div class="stat warn"><div class="label">Low stock items</div><div class="value">${lowStock}</div></div>
    </div>
    <div class="card">
      <h3>Recent sales</h3>
      ${recentSales.length ? recentSales.map(s=>`
        <div class="list-row"><div><div class="name">${escapeHTML(s.no)}</div><div class="meta">${fmtDate(s.date)} · ${escapeHTML(s.customerName||'Walk-in Customer')}</div></div><div class="amt">${fmtINR(s.total)}</div></div>
      `).join('') : `<div class="empty">No sales recorded yet.</div>`}
    </div>
    <div class="card">
      <h3>Recent GRNs</h3>
      ${recentGRNs.length ? recentGRNs.map(g=>`
        <div class="list-row"><div><div class="name">${escapeHTML(g.no)}</div><div class="meta">${fmtDate(g.date)} · ${escapeHTML(g.supplierName||'—')}</div></div><div class="amt">${fmtINR(g.total)}</div></div>
      `).join('') : `<div class="empty">No purchases recorded yet.</div>`}
    </div>
  `;
}

/* ---------------- Inventory ---------------- */
let invSearch = '';
function renderInventory(){
  $('tab-inventory').innerHTML = `
    <div class="row-between">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.5;"><circle cx="11" cy="11" r="7" stroke="#1E2B27" stroke-width="2"/><path d="M21 21l-4-4" stroke="#1E2B27" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" id="invSearchInput" placeholder="Search items…" style="padding-left:28px;" value="${escapeHTML(invSearch)}">
      </div>
      <button class="btn btn-primary" onclick="openItemModal()">+ Add item</button>
    </div>
    <div id="invList"></div>
  `;
  $('invSearchInput').addEventListener('input', (e)=>{ invSearch = e.target.value; renderInvList(); });
  renderInvList();
}
function renderInvList(){
  const q = invSearch.trim().toLowerCase();
  const filtered = items.filter(i=> !q || i.name.toLowerCase().includes(q) || (i.hsn||'').toLowerCase().includes(q));
  if(items.length===0){ $('invList').innerHTML = `<div class="empty">No items in your catalogue yet. Add an item to get started — stock quantities are added later via Purchases / GRN.</div>`; return; }
  if(filtered.length===0){ $('invList').innerHTML = `<div class="empty">No items match your search.</div>`; return; }

  $('invList').innerHTML = filtered.map(i=>{
    const qty = itemTotalQty(i);
    const val = itemStockValue(i);
    const nearest = itemNearestExpiry(i);
    const low = qty <= i.reorder;
    let badge = `<span class="badge gray">No stock</span>`;
    if(nearest){ const d=daysLeft(nearest.expiry); const t=tier(d); badge = `<span class="badge ${tierClass(t)}">${tierLabel(t,d)}</span>`; }
    const expanded = !!invExpanded[i.id];
    return `
    <div class="card" style="margin-bottom:10px;">
      <div class="list-row" style="border:none; padding:0; cursor:pointer;" onclick="toggleInvExpand('${i.id}')">
        <div>
          <div class="name">${escapeHTML(i.name)}</div>
          <div class="meta">${escapeHTML(i.category)} · ${qty} ${escapeHTML(i.unit)} · GST ${i.gst}%${low ? ' · <span style=\"color:var(--amber);font-weight:700;\">Low stock</span>' : ''}</div>
        </div>
        <div class="right" style="display:flex;align-items:center;gap:8px;">

function renderBatchTable(item){
  if(!item.batches.length) return `<div class="expand-body"><div class="empty" style="padding:16px;">No batches yet. Receive stock via Purchases / GRN.</div></div>`;
  const rows = [...item.batches].sort((a,b)=>new Date(a.expiry)-new Date(b.expiry)).map(b=>{
    const d=daysLeft(b.expiry); const t=tier(d);
    return `<tr>
      <td>${escapeHTML(b.batchNo)}</td>
      <td>${fmtDate(b.expiry)} <span class="badge ${tierClass(t)}" style="margin-left:4px;">${tierLabel(t,d)}</span></td>
      <td><input type="number" min="0" value="${b.qty}" style="width:64px;" onchange="adjustBatchQty('${item.id}','${b.id}',this.value)"></td>
      <td>${fmtINR(b.purchasePrice)}</td>
      <td>${fmtINR(b.salePrice)}</td>
      <td><button class="btn-danger-text" onclick="writeOffBatch('${item.id}','${b.id}')">Write off</button></td>
    </tr>`;
  }).join('');
  return `<div class="expand-body"><div class="tbl-wrap"><table>
    <tr><th>Batch</th><th>Expiry</th><th>Qty</th><th>Purch. price</th><th>Sale price</th><th></th></tr>
    ${rows}
  </table></div>
  ${itemTotalQty(item)>0 ? '' : `<div style="margin-top:10px;"><button class="btn-text" onclick="deleteItemMaster('${item.id}')">Delete item from catalogue</button></div>`}
  </div>`;
}
async function adjustBatchQty(itemId, batchId, val){
  const q = parseFloat(val);
  const item = items.find(i=>i.id===itemId); const batch = item.batches.find(b=>b.id===batchId);
  if(isNaN(q) || q<0){ renderInvList(); return; }
  batch.qty = q;
  await saveItems(); showToast('Stock quantity updated'); renderInvList(); 
}
async function writeOffBatch(itemId, batchId){
  if(!confirm('Write off this batch? This removes it from stock permanently.')) return;
  const item = items.find(i=>i.id===itemId);
  item.batches = item.batches.filter(b=>b.id!==batchId);
  await saveItems(); showToast('Batch written off'); renderInvList();
}
async function deleteItemMaster(id){
  if(!confirm('Delete this item from the catalogue?')) return;
  items = items.filter(i=>i.id!==id);
  await saveItems(); showToast('Item deleted'); renderInvList();
}

  grnLines[idx].itemId = itemId;

  renderGRNTable();

function updateGRNRowAmt(idx){
  const l = grnLines[idx];
  const amt = (parseFloat(l.qty)||0) * (parseFloat(l.purchasePrice)||0);
  const cell = $('grnAmt_'+idx);
  if(cell) cell.textContent = fmtINR(amt);
  const total = grnLines.reduce((s,ln)=> s + (parseFloat(ln.qty)||0)*(parseFloat(ln.purchasePrice)||0), 0);

async function saveGRN(){
  const err = $('grn_err');
  err.style.display='none';
  const supplierId = $('grn_supplier').value;
  const date = $('grn_date').value;
  const validLines = grnLines.filter(l=>l.itemId && l.batchNo.trim() && l.expiry && parseFloat(l.qty)>0);
  if(!supplierId){ err.textContent='Please select a supplier.'; err.style.display='block'; return; }
  if(!date){ err.textContent='Please set a GRN date.'; err.style.display='block'; return; }
  if(validLines.length===0){ err.textContent='Add at least one complete line (item, batch, expiry, quantity).'; err.style.display='block'; return; }

  const supplier = suppliers.find(s=>s.id===supplierId);
  const snapshotLines = [];
  validLines.forEach(l=>{
    const item = items.find(i=>i.id===l.itemId);
    const qty = parseFloat(l.qty), pp = parseFloat(l.purchasePrice)||0, sp = parseFloat(l.salePrice)||0, gst=parseFloat(l.gst)||0;
    let batch = item.batches.find(b=>b.batchNo===l.batchNo.trim() && b.expiry===l.expiry);
    if(batch){ batch.qty += qty; batch.purchasePrice = pp; batch.salePrice = sp; }
    else { batch = {id:uid(), batchNo:l.batchNo.trim(), expiry:l.expiry, qty, purchasePrice:pp, salePrice:sp}; item.batches.push(batch); }
    snapshotLines.push({itemId:item.id, itemName:item.name, batchNo:l.batchNo.trim(), expiry:l.expiry, qty, purchasePrice:pp, salePrice:sp, gst, amount:qty*pp});
  });

  meta.grnCounter = (meta.grnCounter||0)+1;
  const grn = {id:uid(), no:'GRN-'+pad(meta.grnCounter,4), date, supplierId, supplierName: supplier?supplier.name:'', lines:snapshotLines, total: snapshotLines.reduce((s,l)=>s+l.amount,0)};
  purchases.push(grn);

  await saveItems(); await savePurchases(); await saveMeta();
  showToast(grn.no+' saved — stock updated');
  grnMode='list'; renderPurchases();
}

}
function renderSaleTable(){

    return `<tr>

function saleLineItemChange(idx, itemId){
  saleLines[idx].itemId = itemId;
  const item = items.find(i=>i.id===itemId);
  saleLines[idx].gst = item? item.gst : 0;

    saleLines[idx].batchId = batches[0].id;
    saleLines[idx].price = batches[0].salePrice;

function saleLineBatchChange(idx, batchId){
  saleLines[idx].batchId = batchId;
  const item = items.find(i=>i.id===saleLines[idx].itemId);
  const batch = item ? item.batches.find(b=>b.id===batchId) : null;

function updateSaleRowAmt(idx){
  const l = saleLines[idx];
  const amt = (parseFloat(l.qty)||0)*(parseFloat(l.price)||0);
  const cell = $('saleAmt_'+idx);

function addSaleLine(){ saleLines.push({itemId:'',batchId:'',qty:'',price:'',gst:0}); renderSaleTable(); }
function removeSaleLine(idx){ saleLines.splice(idx,1); if(saleLines.length===0) saleLines.push({itemId:'',batchId:'',qty:'',price:'',gst:0}); renderSaleTable(); }
function updateSaleTotals(){
  const subtotal = saleLines.reduce((s,l)=> s + (parseFloat(l.qty)||0)*(parseFloat(l.price)||0), 0);
  const gstTotal = saleLines.reduce((s,l)=> s + (parseFloat(l.qty)||0)*(parseFloat(l.price)||0)*((parseFloat(l.gst)||0)/100), 0);
  const discPct = parseFloat($('sale_discount') ? $('sale_discount').value : 0) || 0;
  const discAmt = subtotal * discPct/100;
  const grand = subtotal - discAmt + gstTotal;
  if($('saleSubtotal')){
    $('saleSubtotal').textContent = fmtINR(subtotal);
    $('saleGst').textContent = fmtINR(gstTotal);
    $('saleDisc').textContent = '- '+fmtINR(discAmt);
    $('saleGrand').textContent = fmtINR(grand);
  }
}
async function saveSale(){
  const err = $('sale_err'); err.style.display='none';
  const date = $('sale_date').value;
  const validLines = saleLines.filter(l=>l.itemId && l.batchId && parseFloat(l.qty)>0);
  if(!date){ err.textContent='Please set a date.'; err.style.display='block'; return; }
  if(validLines.length===0){ err.textContent='Add at least one item with a batch and quantity.'; err.style.display='block'; return; }
  for(const l of validLines){
    const item = items.find(i=>i.id===l.itemId);
    const batch = item.batches.find(b=>b.id===l.batchId);
    if(!batch || parseFloat(l.qty) > batch.qty){ err.textContent=`Quantity for "${item.name}" exceeds available stock in the selected batch (${batch?batch.qty:0} available).`; err.style.display='block'; return; }
  }
  const customer = customers.find(c=>c.id===saleCustomerId);
  const snapshotLines = [];
  validLines.forEach(l=>{
    const item = items.find(i=>i.id===l.itemId);
    const batch = item.batches.find(b=>b.id===l.batchId);
    const qty = parseFloat(l.qty), price = parseFloat(l.price)||0, gst=parseFloat(l.gst)||0;
    batch.qty -= qty;
    snapshotLines.push({itemId:item.id, itemName:item.name, batchNo:batch.batchNo, expiry:batch.expiry, qty, price, gst, amount:qty*price});
  });
  const subtotal = snapshotLines.reduce((s,l)=>s+l.amount,0);
  const gstTotal = snapshotLines.reduce((s,l)=>s+l.amount*(l.gst/100),0);
  const discPct = parseFloat($('sale_discount').value)||0;
  const discAmt = subtotal*discPct/100;
  const total = subtotal - discAmt + gstTotal;
  const payMode = $('sale_paymode').value;

  meta.invCounter = (meta.invCounter||0)+1;
  const inv = {id:uid(), no:'INV-'+pad(meta.invCounter,4), date, customerId:saleCustomerId||null, customerName: customer?customer.name:'', lines:snapshotLines, subtotal, gstTotal, discount:discAmt, total, payMode};
  sales.push(inv);

  await saveItems(); await saveSales(); await saveMeta();
  showToast(inv.no+' saved — '+fmtINR(total));
  saleMode='list'; renderBilling();
}

/* ---------------- Reports ---------------- */
function renderReports(){
  $('tab-reports').innerHTML = `
    <div class="subtab">
      <button class="${reportSubTab==='stock'?'active':''}" onclick="reportSubTab='stock'; renderReports();">Stock valuation</button>
      <button class="${reportSubTab==='expiry'?'active':''}" onclick="reportSubTab='expiry'; renderReports();">Expiry</button>
      <button class="${reportSubTab==='sales'?'active':''}" onclick="reportSubTab='sales'; renderReports();">Sales register</button>
      <button class="${reportSubTab==='purchase'?'active':''}" onclick="reportSubTab='purchase'; renderReports();">Purchase register</button>
    </div>
    <div id="reportBody"></div>
  `;
  if(reportSubTab==='stock') renderStockReport();
  if(reportSubTab==='expiry') renderExpiryReport();
  if(reportSubTab==='sales') renderRegisterReport('sales');
  if(reportSubTab==='purchase') renderRegisterReport('purchase');
}
function renderStockReport(){
  const rows = items.filter(i=>itemTotalQty(i)>0);
  const total = rows.reduce((s,i)=>s+itemStockValue(i),0);
  $('reportBody').innerHTML = `
    <div class="card">
      <div class="row-between" style="margin-bottom:6px;"><h3>Stock valuation</h3><button class="btn btn-ghost btn-small" onclick="exportStockCSV()">Export CSV</button></div>
      <div class="tbl-wrap"><table>
        <tr><th>Item</th><th>Qty</th><th>Avg. cost</th><th>Value</th></tr>
        ${rows.map(i=>`<tr><td>${escapeHTML(i.name)}</td><td>${itemTotalQty(i)} ${escapeHTML(i.unit)}</td><td>${fmtINR(i.batches.length?itemStockValue(i)/itemTotalQty(i):0)}</td><td>${fmtINR(itemStockValue(i))}</td></tr>`).join('')}
      </table></div>
      <div class="footer-totals"><div class="line grand"><span>Total stock value</span><span>${fmtINR(total)}</span></div></div>
    </div>`;
}
function exportStockCSV(){
  const rows = items.filter(i=>itemTotalQty(i)>0);
  downloadCSV(['Item','Qty','Unit','Value'], rows.map(i=>[i.name,itemTotalQty(i),i.unit,itemStockValue(i).toFixed(2)]), 'stock-valuation');
}
function renderExpiryReport(){
  let allBatches = [];
  items.forEach(i=> i.batches.forEach(b=> allBatches.push({...b, itemName:i.name})));
  allBatches.sort((a,b)=>new Date(a.expiry)-new Date(b.expiry));
  $('reportBody').innerHTML = `
    <div class="card">
      <div class="row-between" style="margin-bottom:6px;"><h3>Expiry report</h3><button class="btn btn-ghost btn-small" onclick="exportExpiryCSV()">Export CSV</button></div>
      <div class="tbl-wrap"><table>
        <tr><th>Item</th><th>Batch</th><th>Expiry</th><th>Qty</th><th>Status</th></tr>
        ${allBatches.map(b=>{ const d=daysLeft(b.expiry); const t=tier(d); return `<tr><td>${escapeHTML(b.itemName)}</td><td>${escapeHTML(b.batchNo)}</td><td>${fmtDate(b.expiry)}</td><td>${b.qty}</td><td><span class="badge ${tierClass(t)}">${tierLabel(t,d)}</span></td></tr>`; }).join('')}
      </table></div>
      ${allBatches.length===0 ? '<div class="empty">No batches in stock.</div>' : ''}
    </div>`;
}
function exportExpiryCSV(){
  let allBatches = [];
  items.forEach(i=> i.batches.forEach(b=> allBatches.push({...b, itemName:i.name})));
  downloadCSV(['Item','Batch','Expiry','Qty','Days left'], allBatches.map(b=>[b.itemName,b.batchNo,b.expiry,b.qty,daysLeft(b.expiry)]), 'expiry-report');
}
function renderRegisterReport(kind){
  const data = kind==='sales' ? sales : purchases;
  const total = data.reduce((s,x)=>s+x.total,0);
  $('reportBody').innerHTML = `
    <div class="card">
      <div class="row-between" style="margin-bottom:6px;"><h3>${kind==='sales'?'Sales':'Purchase'} register</h3><button class="btn btn-ghost btn-small" onclick="exportRegisterCSV('${kind}')">Export CSV</button></div>
      <div class="tbl-wrap"><table>
        <tr><th>No.</th><th>Date</th><th>${kind==='sales'?'Customer':'Supplier'}</th><th>Items</th><th>Total</th></tr>
        ${[...data].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(x=>`<tr><td>${escapeHTML(x.no)}</td><td>${fmtDate(x.date)}</td><td>${escapeHTML(kind==='sales'?(x.customerName||'Walk-in'):x.supplierName)}</td><td>${x.lines.length}</td><td>${fmtINR(x.total)}</td></tr>`).join('')}
      </table></div>
      <div class="footer-totals"><div class="line grand"><span>Total</span><span>${fmtINR(total)}</span></div></div>
      ${data.length===0 ? `<div class="empty">No ${kind==='sales'?'sales':'purchases'} recorded yet.</div>` : ''}
    </div>`;
}
function exportRegisterCSV(kind){
  const data = kind==='sales' ? sales : purchases;
  downloadCSV(['No','Date',kind==='sales'?'Customer':'Supplier','Items','Total'], data.map(x=>[x.no,x.date,kind==='sales'?(x.customerName||'Walk-in'):x.supplierName,x.lines.length,x.total.toFixed(2)]), kind+'-register');
}
function downloadCSV(headers, rows, filename){
  const csv = [headers, ...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`${filename}-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('CSV exported');
}

document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ closeModal('itemOverlay'); closeModal('partyOverlay'); } });
loadAll();
</script>
